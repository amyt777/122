name = "watchpay-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"

[vars]
ENVIRONMENT = "production"
DEFAULT_DAILY_AD_LIMIT = 50
DEFAULT_HOURLY_AD_LIMIT = 10
DEFAULT_AD_REWARD = 1.50
DEFAULT_PREMIUM_AD_REWARD = 2.50
DEFAULT_DAILY_BONUS = 2.00
DEFAULT_PREMIUM_DAILY_BONUS = 5.00
DEFAULT_MIN_WITHDRAWAL = 50.00
DEFAULT_WITHDRAW_FEE_PERCENT = 2
DEFAULT_REFERRAL_COMMISSION_PERCENT = 10
MONETAG_ZONE_ID = "892341"

# The following secrets must be set via wrangler secret put <NAME>:
# TELEGRAM_BOT_TOKEN
# TELEGRAM_ADMIN_CHAT_ID
# FIREBASE_CLIENT_EMAIL
# FIREBASE_PRIVATE_KEY
# FIREBASE_DB_URL
# MONETAG_API_URL
# MONETAG_API_TOKEN
